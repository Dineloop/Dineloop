<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DineLoop · Smart Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#0e0b11;--sf:rgba(24,19,30,.86);--sf2:rgba(18,14,24,.95);--tx:#faf7f2;--mu:#a89bb0;--ac:#f59e0b;--ac2:#f43f5e;--ln:rgba(245,158,11,.24);--wr:#fb7185;--ok:#34d399;--wn:#fbbf24;--inbg:rgba(12,9,16,.85);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f3ee;--sf:rgba(255,255,255,.94);--sf2:rgba(255,255,255,.98);--tx:#1c1614;--mu:#6d635d;--ac:#d97706;--ac2:#e11d48;--ln:rgba(217,119,6,.25);--wr:#dc2626;--ok:#059669;--wn:#b45309;--inbg:#faf7f4;color-scheme:light}
:root[data-theme="mint"]{--bg:#071314;--sf:rgba(11,29,31,.88);--sf2:rgba(8,22,24,.96);--tx:#eefcfb;--mu:#82aba9;--ac:#14b8a6;--ac2:#f59e0b;--ln:rgba(20,184,166,.26);--wr:#fb7185;--ok:#34d399;--wn:#fbbf24;--inbg:rgba(6,17,18,.88);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:500 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg) radial-gradient(ellipse at 10% -10%,rgba(245,158,11,.16),transparent 48%) fixed,radial-gradient(ellipse at 92% 105%,rgba(244,63,94,.14),transparent 50%) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sf2)}
header,main{position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--sf2);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.18)}
h1{font:800 18px Outfit,sans-serif;margin:0;letter-spacing:.02em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.pill{font:700 11px Outfit,sans-serif;padding:3px 10px;border-radius:99px;border:1px solid var(--ok);color:var(--ok);white-space:nowrap}
.pill.l{border-color:var(--ac2);color:var(--ac2)}.pill.w{border-color:var(--wn);color:var(--wn)}
#clk{font:600 12px Outfit,sans-serif;color:var(--mu);white-space:nowrap}
nav{display:flex;gap:5px;overflow-x:auto;flex:1;padding:2px 0}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--ln);background:rgba(245,158,11,.08);color:var(--tx);border-radius:11px;padding:7px 12px;transition:.16s;white-space:nowrap}
button:hover{box-shadow:0 4px 16px rgba(245,158,11,.25);border-color:var(--ac);transform:translateY(-1px)}button:active{transform:scale(.97)}
button.on,button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(244,63,94,.3)}
button.ok{border-color:var(--ok);color:var(--ok);background:rgba(52,211,153,.12)}
button.wr{border-color:var(--wr);color:var(--wr);background:rgba(251,113,133,.12)}
button.sm{padding:5px 9px;font-size:13px;border-radius:9px}
button:disabled{opacity:.45;cursor:not-allowed}
main{padding:14px;max-width:1260px;margin:auto}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.g2,.g3,.cols{grid-template-columns:1fr}}
.card{position:relative;background:var(--sf);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.16)}
.card::before{content:"";position:absolute;left:22px;right:22px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),transparent);opacity:.85}
.card>b:first-child,.ttl{font:700 13px Outfit,sans-serif;letter-spacing:.06em;color:var(--ac);text-transform:uppercase;display:inline-block}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin-top:9px}
.menu button{text-align:left;padding:11px;white-space:normal;position:relative;background:rgba(245,158,11,.06)}
.menu button.oos{opacity:.45;border-color:var(--wr)}.menu small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(168,155,176,.18)}
.tbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--inbg);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.k{border-left:4px solid var(--ac);background:var(--inbg);padding:11px;margin:8px 0;border-radius:10px;cursor:pointer}.c1 .k{border-color:var(--ac2)}.c2 .k{border-color:var(--ok)}
.tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);display:inline-block}
.low{color:var(--wr);border-color:var(--wr)}.okt{color:var(--ok);border-color:var(--ok)}.wnt{color:var(--wn);border-color:var(--wn)}
.bar{display:flex;align-items:flex-end;gap:5px;height:105px}.bar i{flex:1;background:linear-gradient(0deg,var(--ac2),var(--ac));border-radius:6px 6px 0 0;min-height:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stats .card{margin-bottom:0}.stats b{display:block;font:800 22px Outfit,sans-serif;color:var(--tx);margin-top:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid rgba(168,155,176,.18)}th{color:var(--mu);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.mdl-bg{position:fixed;inset:0;background:rgba(8,6,10,.78);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mdl{background:var(--sf2);border:1px solid var(--ac);border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.qr-box{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:10px auto;text-align:center}
.qr-box img,.qr-box svg{display:block;margin:auto;max-width:220px;height:auto}
.w-bar{position:sticky;bottom:8px;background:var(--sf2);border:1px solid var(--ac);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:15}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;padding:10px 18px;border-radius:99px;display:none;z-index:70;box-shadow:0 6px 24px rgba(0,0,0,.35)}
a{color:var(--ac)}.mu{color:var(--mu);font-size:13px}#rcp{display:none}
@page{margin:2mm}
@media print{
  body>*:not(#rcp){display:none!important}
  body::before{display:none}
  #rcp{display:block;white-space:pre-wrap;font:12px/1.3 monospace;color:#000;background:#fff;width:72mm;padding:2mm}
  #rcp .rqr{text-align:center;margin-top:6px}#rcp .rqr svg,#rcp .rqr img{width:130px;height:130px}
}
</style>
</head>
<body>
<header>
  <h1 id="brand">🍽️ DINELOOP</h1>
  <span class="pill" id="st"></span>
  <span id="roleChip" class="pill w" style="cursor:pointer;display:none" onclick="openPinSwitch()"></span>
  <span id="clk"></span>
  <nav id="nav"></nav>
  <button class="sm" id="btnTheme" onclick="cycleTheme()" title="Switch Theme">🎨</button>
  <button class="sm" id="btnOut" style="display:none" onclick="doLogout()">Logout</button>
</header>
<main id="v"></main>
<div id="mdlHost"></div>
<div id="toast"></div>
<div id="rcp"></div>

<script>
const CFG={url:"https://edgklbjmkewdokvptksx.supabase.co",key:"sb_publishable_3Vjm7jhwAKDP9d5BFhaUvA_qOBXKqWc",outlet:"main"};
const $=s=>document.querySelector(s),R=n=>Math.round((+n||0)*100)/100;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TB=["T1","T2","T3","T4","T5","T6","T7","T8","Counter","Takeaway"];

function defaultCfg(){
  return{
    rName:"DINELOOP",tag:"Smart Restaurant POS",addr:"",phone:"",gstin:"",fssai:"",
    taxPct:5,taxInc:false,invPrefix:"DL-",invNext:1,
    svcPct:0,pkgFee:0,delFee:0,
    upiId:"",upiName:"",bankInfo:"",staticQr:"",
    waiterCanPay:true,ptsPer10:1,redeemPts:100,redeemVal:50,
    openCash:0,mgrPin:"1234",coupons:[],staffPins:[]
  };
}
function seed(){
  return{
    menu:[
      {id:0,n:"Masala Dosa",p:120,c:"Mains",s:"",u:0,g:null,v:[],a:[],oos:false},
      {id:1,n:"Masala Chai",p:40,c:"Drinks",s:"",u:0,g:null,v:[],a:[],oos:false}
    ],
    stock:[],cust:{},bills:[],kots:[],open:{},openMeta:{},kn:0,cfg:defaultCfg()
  };
}
function normState(x){
  const d=seed(),s=(x&&typeof x==="object")?x:{};
  s.menu=Array.isArray(s.menu)?s.menu.map((m,i)=>({id:m.id??i,n:m.n||"Dish",p:+m.p||0,c:m.c||"Mains",s:m.s||"",u:+m.u||0,g:m.g===0||m.g>0?+m.g:null,v:Array.isArray(m.v)?m.v:[],a:Array.isArray(m.a)?m.a:[],oos:!!m.oos})):d.menu;
  s.stock=Array.isArray(s.stock)?s.stock:[];
  s.cust=(s.cust&&typeof s.cust==="object")?s.cust:{};
  s.bills=Array.isArray(s.bills)?s.bills:[];
  s.kots=Array.isArray(s.kots)?s.kots:[];
  s.open=(s.open&&typeof s.open==="object")?s.open:{};
  s.openMeta=(s.openMeta&&typeof s.openMeta==="object")?s.openMeta:{};
  s.kn=+s.kn||0;
  s.cfg=Object.assign(defaultCfg(),s.cfg||{});
  if(!Array.isArray(s.cfg.coupons))s.cfg.coupons=[];
  if(!Array.isArray(s.cfg.staffPins))s.cfg.staffPins=[];
  return s;
}

let S=normState(null);
try{const ls=JSON.parse(localStorage.getItem("dl2")||"null");if(ls)S=normState(ls);}catch(e){}

let sb=null,user=null,tmr=null,rtCh=null;
let myRole="admin",trueRole="admin",activeName="Owner",activeOutlet=CFG.outlet;
let restList=[],roleList=[],restInfo=null;
let tab="bill",tb="T1",q="",cat="All",ph="",nmv="",op=false,rd=false,ap=false,link="",lastB=null,LD=14,sg="Lapsed";
let msg="Hi {name}, we miss you at {rName}! Show this message for a special treat on your next visit.";
let wCat="All",wQ="",ocrRows=[],ocrBusy=false,aiAns="",aiBusy=false;

function save(){
  try{localStorage.setItem("dl2_"+activeOutlet,JSON.stringify(S));if(activeOutlet===CFG.outlet)localStorage.setItem("dl2",JSON.stringify(S));}catch(e){}
  if(sb&&user){
    clearTimeout(tmr);
    tmr=setTimeout(()=>{
      S._r=Math.random();
      sb.from("app_state").upsert({id:activeOutlet,data:S}).then(r=>r.error&&toast("Sync failed: "+r.error.message));
    },380);
  }
}

async function loadOutletState(outletId){
  activeOutlet=outletId;
  let loaded=null;
  if(sb&&user){
    const r=await sb.from("app_state").select("data").eq("id",outletId).maybeSingle();
    if(r.error){toast("Load error: "+r.error.message);}
    if(r.data&&r.data.data)loaded=r.data.data;
  }
  if(!loaded){
    try{loaded=JSON.parse(localStorage.getItem("dl2_"+outletId)||"null");}catch(e){}
  }
  S=normState(loaded);
  if(sb&&user&&!loaded)save();
  subRealtime();
}

function subRealtime(){
  if(!sb||!user)return;
  if(rtCh){try{sb.removeChannel(rtCh)}catch(e){}}
  rtCh=sb.channel("dl-"+activeOutlet)
    .on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"id=eq."+activeOutlet},p=>{
      const n=p.new&&p.new.data;
      if(n&&n._r!==S._r&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){
        S=normState(n);render();
      }
    }).subscribe();
}

async function boot(){
  if(!sb&&CFG.url&&window.supabase)sb=supabase.createClient(CFG.url,CFG.key);
  if(sb&&!user){
    const g=await sb.auth.getSession();
    user=g.data.session&&g.data.session.user;
    if(!user)return login();
    // Load SaaS role & restaurant context (gracefully handles pre-02_saas_roles.sql too)
    const rr=await sb.from("user_roles").select("*").eq("user_id",user.id).maybeSingle();
    if(!rr.error&&rr.data){
      if(!rr.data.active)return blockedScreen("Your staff account is disabled. Contact your Restaurant Admin.");
      trueRole=rr.data.role;myRole=rr.data.role;
      activeName=rr.data.display_name||user.email.split("@")[0];
      activeOutlet=rr.data.restaurant_id||CFG.outlet;
    }else if(!rr.error&&!rr.data){
      // Table exists, check if user has no role row
      const cnt=await sb.from("user_roles").select("user_id",{count:"exact",head:true});
      if(!cnt.error&&(cnt.count||0)>0){
        return blockedScreen("No restaurant role assigned to "+user.email+". Ask Platform Owner or Admin to assign your email.");
      }
    }
    await loadSaasLists();
    if(restInfo&&restInfo.active===false&&trueRole!=="superadmin"){
      return blockedScreen("Subscription paused for "+restInfo.name+". Please contact DineLoop Support.");
    }
    await loadOutletState(activeOutlet);
    if(myRole==="waiter")tab="waiter";
    else if(myRole==="kitchen")tab="kds";
    else tab="bill";
  }
  render();
}

async function loadSaasLists(){
  if(!sb||!user)return;
  const r1=await sb.from("restaurants").select("*").order("created_at",{ascending:true});
  if(!r1.error&&r1.data){
    restList=r1.data;
    restInfo=restList.find(x=>x.id===activeOutlet)||null;
  }
  const r2=await sb.from("user_roles").select("*").order("created_at",{ascending:true});
  if(!r2.error&&r2.data)roleList=r2.data;
}

function blockedScreen(msgText){
  $("#nav").innerHTML="";$("#btnOut").style.display="inline-block";
  $("#v").innerHTML=`<div class="card" style="max-width:440px;margin:40px auto;text-align:center"><b>Access Paused</b><p style="margin:14px 0">${esc(msgText)}</p><button class="pri" onclick="doLogout()">Sign out</button></div>`;
}

function login(){
  $("#nav").innerHTML="";$("#roleChip").style.display="none";$("#btnOut").style.display="none";
  $("#st").textContent="SIGN IN";$("#st").className="pill l";
  $("#v").innerHTML=`<div class="card" style="max-width:380px;margin:40px auto">
    <b>Staff Sign In</b>
    <p class="mu">Sign in with your DineLoop staff email & password</p>
    <input id="em" placeholder="Email" autocomplete="username" style="margin:8px 0">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="pri" style="margin-top:12px;width:100%" onclick="doLogin()">Open POS</button>
  </div>`;
}

async function doLogin(){
  const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(r.error)return toast(r.error.message);
  user=r.data.user;boot();
}
async function doLogout(){
  if(sb)await sb.auth.signOut();
  user=null;trueRole="admin";myRole="admin";location.reload();
}

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display="none",2600)}
setInterval(()=>{$("#clk").textContent=new Date().toLocaleTimeString("en-IN")},1000);

const THEMES=["","light","mint"];
let curTheme="";try{curTheme=localStorage.getItem("dl_theme")||"";if(curTheme)document.documentElement.setAttribute("data-theme",curTheme);}catch(e){}
function cycleTheme(){
  curTheme=THEMES[(THEMES.indexOf(curTheme)+1)%THEMES.length];
  if(curTheme)document.documentElement.setAttribute("data-theme",curTheme);else document.documentElement.removeAttribute("data-theme");
  try{localStorage.setItem("dl_theme",curTheme);}catch(e){}
  toast("Theme: "+(curTheme==="light"?"Daylight Pro":curTheme==="mint"?"Royal Mint":"Bistro Gold"));
}

const ROLE_TABS={
  superadmin:[["bill","◉ Billing"],["waiter","⌖ Waiter"],["kds","🍳 Kitchen"],["menu","☰ Menu"],["stock","📦 Stock"],["cust","✦ Loyalty"],["rep","◭ Reports"],["cfg","⚙ Settings"],["saas","⌘ SaaS"]],
  admin:[["bill","◉ Billing"],["waiter","⌖ Waiter"],["kds","🍳 Kitchen"],["menu","☰ Menu"],["stock","📦 Stock"],["cust","✦ Loyalty"],["rep","◭ Reports"],["cfg","⚙ Settings"]],
  manager:[["bill","◉ Billing"],["waiter","⌖ Waiter"],["kds","🍳 Kitchen"],["menu","☰ Menu"],["stock","📦 Stock"],["cust","✦ Loyalty"],["rep","◭ Reports"]],
  cashier:[["bill","◉ Billing"],["kds","🍳 Kitchen"],["cust","✦ Loyalty"],["rep","◭ Reports"]],
  waiter:[["waiter","⌖ Waiter Order"]],
  kitchen:[["kds","🍳 Kitchen KDS"]]
};
function allowedTabs(){return ROLE_TABS[myRole]||ROLE_TABS.admin}
function go(k){tab=k;render()}
const M=id=>S.menu.find(x=>x.id==id);
const seg=c=>(Date.now()-(c.last||0))/864e5>=LD?"Lapsed":c.visits>=3?"Regular":"New";
const meta=t=>(S.openMeta[t]=S.openMeta[t]||{mode:t==="Takeaway"?"Parcel":"Dine-In",prepaid:false,discType:"",discVal:0,coupon:"",note:""});

function render(){
  const tabs=allowedTabs();
  if(!tabs.some(x=>x[0]===tab))tab=tabs[0][0];
  $("#brand").textContent="🍽️ "+(S.cfg.rName||"DINELOOP").toUpperCase();
  $("#st").textContent=sb?("CLOUD SYNC · "+activeOutlet):"LOCAL MODE";
  $("#st").className="pill"+(sb?"":" l");
  $("#roleChip").style.display="inline-block";
  $("#roleChip").textContent=`${activeName} (${myRole.toUpperCase()}) ▾`;
  $("#btnOut").style.display=sb&&user?"inline-block":"none";
  $("#nav").innerHTML=tabs.map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  const views={bill:vBill,waiter:vWaiter,kds:vKds,menu:vMenu,stock:vStock,cust:vCust,rep:vRep,cfg:vCfg,saas:vSaas};
  $("#v").innerHTML=(views[tab]||vBill)();
  if(tab==="bill"){grid();cart();}
  if(tab==="waiter"){wGrid();}
}

function closeMdl(){$("#mdlHost").innerHTML=""}
function showMdl(html){$("#mdlHost").innerHTML=`<div class="mdl-bg" onclick="if(event.target===this)closeMdl()"><div class="mdl">${html}</div></div>`}

function requireMgrPin(fn){
  if(myRole==="superadmin"||myRole==="admin"||myRole==="manager")return fn();
  showMdl(`<b>Manager PIN Required</b><p class="mu">Enter Manager/Admin PIN to approve this action.</p>
    <input id="pinIn" type="password" inputmode="numeric" placeholder="PIN (default 1234)" style="margin:8px 0">
    <div class="tbs"><button class="pri" onclick="verifyMgrPin()">Verify</button><button onclick="closeMdl()">Cancel</button></div>`);
  window._pinCb=fn;setTimeout(()=>$("#pinIn")?.focus(),50);
}
function verifyMgrPin(){
  if($("#pinIn").value===(S.cfg.mgrPin||"1234")){closeMdl();window._pinCb&&window._pinCb();}
  else toast("Wrong PIN");
}

function openPinSwitch(){
  const pins=S.cfg.staffPins||[];
  showMdl(`<b>Switch Crew Role / PIN</b>
    <p class="mu">Current: ${esc(activeName)} (${myRole.toUpperCase()}). ${trueRole==="waiter"||trueRole==="kitchen"?"Enter Manager PIN to elevate.":"Switch view or enter staff PIN:"}</p>
    <div style="margin:8px 0">
      <label class="mu">Select Role</label>
      <select id="swRole">
        ${["waiter","kitchen","cashier","manager","admin",...(trueRole==="superadmin"?["superadmin"]:[])].map(r=>`<option value="${r}" ${r===myRole?"selected":""}>${r.toUpperCase()}</option>`).join("")}
      </select>
    </div>
    <input id="swPin" type="password" inputmode="numeric" placeholder="PIN (Admin/Manager PIN: ${trueRole==='superadmin'||trueRole==='admin'?'your mgrPin':'required for higher role'})" style="margin-bottom:10px">
    ${pins.length?`<div class="tbs">${pins.map((p,i)=>`<button class="sm" onclick="quickPin(${i})">${esc(p.name)} (${p.role})</button>`).join("")}</div>`:""}
    <div class="tbs"><button class="pri" onclick="doPinSwitch()">Switch</button><button onclick="closeMdl()">Close</button></div>`);
}
function doPinSwitch(){
  const r=$("#swRole").value,pin=$("#swPin").value;

// ---------- QR CODE HELPER (pure client-side SVG via qrcode-generator) ----------
function makeQrSvg(text,px=200){
  if(!text)return"";
  if(window.qrcode){
    const qr=qrcode(0,"M");qr.addData(text);qr.make();
    const n=qr.getModuleCount(),cell=Math.max(3,Math.floor(px/n)),sz=n*cell;
    let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))d+=`M${c*cell},${r*cell}h${cell}v${cell}h-${cell}z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return `<div style="padding:12px;color:#000;font-size:12px">QR text: ${esc(text)}</div>`;
}
function upiUri(amount,note){
  const id=(S.cfg.upiId||"").trim();if(!id)return"";
  const pn=encodeURIComponent(S.cfg.upiName||S.cfg.rName||"DineLoop");
  const tn=encodeURIComponent(note||"Bill Payment");
  return `upi://pay?pa=${encodeURIComponent(id)}&pn=${pn}&am=${R(amount).toFixed(2)}&cu=INR&tn=${tn}`;
}
function openUpiQr(tableKey,amt,label){
  const uri=upiUri(amt,(S.cfg.rName||"DineLoop")+" "+tableKey);
  if(!uri&&!S.cfg.staticQr)return toast("Set your UPI ID or Static QR in Settings first!");
  showMdl(`<b>Pay via UPI · ${esc(label||tableKey)}</b>
    <div style="text-align:center;margin:10px 0">
      <div style="font:800 26px Orbitron,sans-serif;color:var(--ac)">₹${R(amt)}</div>
      <div class="mu">${esc(S.cfg.upiName||S.cfg.rName)} · ${esc(S.cfg.upiId||"Static QR")}</div>
      <div class="qr-box">${uri?makeQrSvg(uri,220):`<img src="${S.cfg.staticQr}" alt="UPI QR">`}</div>
      ${S.cfg.bankInfo?`<div class="mu" style="margin-top:4px">${esc(S.cfg.bankInfo)}</div>`:""}
    </div>
    <div class="tbs" style="justify-content:center">
      ${uri?`<a href="${uri}" style="text-decoration:none"><button class="pri">Open UPI App</button></a>`:""}
      <button onclick="closeMdl()">Close</button>
    </div>`);
}

// ---------- CART & BILL MATH ----------
function itemUnitPrice(l){
  const m=M(l.id);if(!m)return 0;
  let p=+m.p||0;
  if(l.v&&m.v){const vr=m.v.find(x=>x.n===l.v);if(vr)p=+vr.p||p;}
  if(Array.isArray(l.add)&&m.a){l.add.forEach(an=>{const ad=m.a.find(x=>x.n===an);if(ad)p+=(+ad.p||0);});}
  return R(p);
}
function itemLabel(l){
  const m=M(l.id);if(!m)return"";
  let s=m.n;
  if(l.v)s+=` (${l.v})`;
  if(l.add&&l.add.length)s+=` +${l.add.join(",")}`;
  return s;
}
function calc(t=tb){
  const o=(S.open[t]||[]).filter(l=>M(l.id)),mt=meta(t),c=S.cust[ph];
  let sub=0,taxSum=0;
  o.forEach(l=>{
    const m=M(l.id),up=itemUnitPrice(l),line=up*l.q,rate=(m.g!==null&&m.g!==undefined)?+m.g:+S.cfg.taxPct;
    if(S.cfg.taxInc){
      const base=line/(1+rate/100);sub+=base;taxSum+=(line-base);
    }else{
      sub+=line;taxSum+=line*(rate/100);
    }
  });
  sub=R(sub);
  let loyDisc=rd&&c&&c.pts>=(S.cfg.redeemPts||100)?Math.min(S.cfg.redeemVal||50,sub):0;
  let manDisc=0;
  if(mt.discType==="pct")manDisc=R(sub*(Math.min(100,+mt.discVal||0)/100));
  else if(mt.discType==="flat")manDisc=Math.min(sub,+mt.discVal||0);
  const disc=R(Math.min(sub,loyDisc+manDisc));
  const discRatio=sub>0?Math.max(0,(sub-disc)/sub):1;
  const tax=R(taxSum*discRatio),cgst=R(tax/2),sgst=R(tax-cgst);
  const svc=R((sub-disc)*(+S.cfg.svcPct||0)/100);
  const pkg=mt.mode==="Parcel"&&o.length?(+S.cfg.pkgFee||0):0;
  const del=mt.mode==="Delivery"&&o.length?(+S.cfg.delFee||0):0;
  const raw=sub-disc+tax+svc+pkg+del,tot=Math.round(raw);
  return{o,mt,sub,loyDisc,manDisc,disc,tax,cgst,sgst,svc,pkg,del,ro:R(tot-raw),tot,c};
}

function add(id,t=tb){
  const m=M(id);if(!m)return;
  if(m.oos)return toast(m.n+" is Out of Stock (86'd)");
  if((m.v&&m.v.length)||(m.a&&m.a.length))return openItemPicker(id,t);
  pushLine(id,t,"",[], "");
}
function pushLine(id,t,v,adds,note){
  const o=S.open[t]=S.open[t]||[];
  const key=v+"|"+adds.join(",")+"|"+(note||"");
  const l=o.find(x=>x.id==id&&(x.v||"")+"|"+(x.add||[]).join(",")+"|"+(x.note||"")===key);
  l?l.q++:o.push({id,q:1,sent:0,v:v||"",add:adds,note:note||""});
  save();if(tab==="bill"){cart();renderTabsOnly();}else if(tab==="waiter"){render();}
}

    ${m.v&&m.v.length?`<div style="margin:10px 0"><div class="mu">Variant</div><div class="tbs">${m.v.map((vr,i)=>`<label class="tag" style="cursor:pointer;padding:6px 10px"><input type="radio" name="pv" value="${esc(vr.n)}" ${i===0?"checked":""} style="width:auto"> ${esc(vr.n)} ₹${vr.p}</label>`).join("")}</div></div>`:""}
    ${m.a&&m.a.length?`<div style="margin:10px 0"><div class="mu">Add-ons</div><div class="tbs">${m.a.map(ad=>`<label class="tag" style="cursor:pointer;padding:6px 10px"><input type="checkbox" class="pa" value="${esc(ad.n)}" style="width:auto"> ${esc(ad.n)} +₹${ad.p}</label>`).join("")}</div></div>`:""}

// ---------- KOT & PAYMENT ----------
function kot(quiet=false,t=tb){
  const o=S.open[t]||[],mt=meta(t);
  const it=o.filter(l=>l.q>l.sent).map(l=>({n:itemLabel(l),q:l.q-l.sent,note:l.note||""}));
  if(!it.length){if(!quiet)toast("Nothing new to send");return false}
  const k={id:++S.kn,table:t,mode:mt.mode,prepaid:!!mt.prepaid,by:activeName,items:it,st:0,t:Date.now()};
  S.kots.push(k);o.forEach(l=>l.sent=l.q);
  save();if(tab==="bill")cart();else render();
  if(!quiet)toast("KOT #"+k.id+" sent to kitchen");
  if(ap){
    pt(["KOT #"+k.id+"  "+t+" ["+mt.mode+(mt.prepaid?" PAID":"")+"]",new Date(k.t).toLocaleTimeString("en-IN"),"-".repeat(32),...it.map(x=>x.q+" x "+x.n+(x.note?" ("+x.note+")":""))].join("\n"));
  }
  return true;
}

function pay(m,t=tb,splits=null){
  const c=calc(t);if(!c.o.length)return toast("Add items first");
  kot(true,t);
  const P=ph,ok=P.length===10;let u=null,waTxt="";
  const invNo=(S.cfg.invPrefix||"DL-")+String(S.cfg.invNext||1).padStart(4,"0");
  S.cfg.invNext=(S.cfg.invNext||1)+1;
  const billItems=c.o.map(l=>({n:itemLabel(l),q:l.q,p:itemUnitPrice(l)}));
  if(ok){
    u=S.cust[P]=S.cust[P]||{name:"",pts:0,visits:0,last:0,spent:0,opt:0};
    u.name=nmv||u.name||"Guest";
    const earned=Math.floor(c.tot/10)*(S.cfg.ptsPer10||1);
    u.pts+=earned-(c.loyDisc?(S.cfg.redeemPts||100):0);
    u.visits++;u.last=Date.now();u.spent+=c.tot;
    u.lastOrder=c.o.map(l=>({n:M(l.id).n,q:l.q}));
    if(op)u.opt=1;
    waTxt=`Thanks for visiting ${S.cfg.rName}! Bill ${invNo} ₹${c.tot} paid by ${m}. Earned ${earned} pts (Bal: ${u.pts}).`;
  }
  c.o.forEach(l=>{const it=M(l.id),s=S.stock.find(x=>x.n===it.s);if(s)s.q=R(Math.max(0,s.q-it.u*l.q));});
  const payLabel=splits?Object.entries(splits).map(([k,v])=>`${k} ₹${v}`).join(" + "):m;
  lastB={
    no:S.bills.length+1,invNo,t:Date.now(),table:t,mode:c.mt.mode,prepaid:!!c.mt.prepaid,
    items:billItems,sub:c.sub,disc:c.disc,tax:c.tax,cgst:c.cgst,sgst:c.sgst,svc:c.svc,pkg:c.pkg,del:c.del,ro:c.ro,
    tot:c.tot,pay:m,payLabel,splits,ph:ok?P:"",cashier:activeName
  };
  S.bills.push(lastB);
  S.open[t]=[];S.openMeta[t]={mode:t==="Takeaway"?"Parcel":"Dine-In",prepaid:false,discType:"",discVal:0,coupon:"",note:""};
  rd=false;ph="";nmv="";op=false;
  const waBtn=ok?`<button onclick="sendBillWA('${P}',lastB)">WhatsApp E-Bill</button>`:"";
  link=`<div class="tbs" style="margin-top:6px"><button class="ok" onclick="prn()">Print Bill (${invNo})</button>${waBtn}</div>`;
  save();toast("Paid ₹"+c.tot+" ("+invNo+")");render();
  if(ok&&u&&u.opt)sendWA(P,waTxt);
}

// ---------- RECEIPT PRINTING + WHATSAPP E-BILL ----------
const L=(a,b)=>String(a).padEnd(23)+String(b).padStart(9);
function bt(b){
  const lines=[
    (S.cfg.rName||"DINELOOP").toUpperCase(),
    ...(S.cfg.addr?[S.cfg.addr]:[]),
    ...(S.cfg.phone?["Ph: "+S.cfg.phone]:[]),
    ...(S.cfg.gstin?["GSTIN: "+S.cfg.gstin]:[]),
    "Bill "+(b.invNo||"#"+b.no)+"  "+new Date(b.t).toLocaleString("en-IN"),
    "Table: "+b.table+" ["+(b.mode||"Dine-In")+"]",
    "-".repeat(32),
    ...b.items.map(i=>L(i.n.slice(0,17)+" x"+i.q,"₹"+R(i.p*i.q))),
    "-".repeat(32),
    L("Subtotal","₹"+R(b.sub)),
    ...(b.disc?[L("Discount","-₹"+R(b.disc))]:[]),
    ...(b.tax?[L("CGST","₹"+R(b.cgst||b.tax/2)),L("SGST","₹"+R(b.sgst||b.tax/2))]:[]),
    ...(b.svc?[L("Service Chg","₹"+R(b.svc))]:[]),
    ...(b.pkg?[L("Packaging","₹"+R(b.pkg))]:[]),
    ...(b.del?[L("Delivery","₹"+R(b.del))]:[]),

      </div>

function smartParseMenuText(raw){
  const lines=String(raw||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let curCat="Mains";const out=[];
  for(const line of lines){
    // Detect category header (no digits, short)
    if(!/\d/.test(line)&&line.length>=3&&line.length<=28&&!/^(menu|gst|phone|tel|address)/i.test(line)){
      curCat=line.replace(/[:\-*#]+/g,"").trim();continue;
    }
    const m=line.match(/^(.+?)\s*(?:[-–:|.]+\s*|\s+)(?:rs\.?|inr|₹)?\s*(\d{2,4})(?:\.\d{1,2})?\s*$/i);
    if(m){
      const name=m[1].replace(/[.\-–:]+$/,"").trim();
      const price=+m[2];
      if(name.length>=2&&price>0&&price<20000)out.push({n:name,p:price,c:curCat,g:S.cfg.taxPct});
    }
  }
  return out;
}

async function handleOcrFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  $("#ocrOut").innerHTML=`<p>Reading <b>${esc(f.name)}</b>…</p>`;
  if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
    try{
      const pdfText=await extractPdfText(f);
      if(pdfText&&pdfText.trim().length>20){
        const localRows=smartParseMenuText(pdfText);
        if(sb){
          const aiRows=await callAiOcr({rawText:pdfText});
          if(aiRows&&aiRows.length){ocrRows=aiRows;return renderOcrPreview("Extracted from PDF via AI");}
        }
        if(localRows.length){ocrRows=localRows;return renderOcrPreview("Extracted from PDF text");}
      }
      // Scanned PDF fallback -> send base64 to Gemini
      const b64=await fileToB64(f);
      const aiRows=await callAiOcr({fileBase64:b64,mimeType:"application/pdf"});
      if(aiRows&&aiRows.length){ocrRows=aiRows;return renderOcrPreview("Extracted from Scanned PDF via AI");}
      $("#ocrOut").innerHTML=`<p class="mu" style="color:var(--wr)">Could not auto-extract scanned PDF. Set GEMINI_API_KEY in Supabase (doc 06) or paste the text above.</p>`;
    }catch(e){$("#ocrOut").innerHTML=`<p style="color:var(--wr)">PDF read error: ${esc(e.message)}</p>`;}
  }else{
    // Image -> compress & call Gemini Vision OCR
    try{
      const b64=await compressImgB64(f,1400);
      const aiRows=await callAiOcr({fileBase64:b64,mimeType:"image/jpeg"});
      if(aiRows&&aiRows.length){ocrRows=aiRows;return renderOcrPreview("Extracted from Photo via AI");}
      $("#ocrOut").innerHTML=`<p class="mu" style="color:var(--wr)">Photo OCR needs Gemini AI key in Supabase Edge Function (ai-assistant). You can also paste menu lines like "Paneer Tikka - 240" above!</p>`;
    }catch(e){$("#ocrOut").innerHTML=`<p style="color:var(--wr)">Image read error: ${esc(e.message)}</p>`;}
  }
}

async function callAiOcr(payload){
  if(!sb)return null;
  const r=await sb.functions.invoke("ai-assistant",{body:{mode:"ocr",...payload}});
  if(r.error||!r.data||r.data.fallback||!r.data.text)return null;
  try{
    const clean=r.data.text.replace(/```json|```/g,"").trim();
    const arr=JSON.parse(clean);
    return Array.isArray(arr)?arr.filter(x=>x&&x.n&&(+x.p>0)):null;
  }catch(e){return null;}
}

async function extractPdfText(file){
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
      s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  }
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let all="";
  for(let p=1;p<=Math.min(pdf.numPages,10);p++){
    const pg=await pdf.getPage(p),tc=await pg.getTextContent();
    all+=tc.items.map(i=>i.str).join(" ")+"\n";
  }
  return all;
}

function fileToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);
  });
}
function compressImgB64(file,maxW){
  return new Promise((res,rej)=>{
    const img=new Image(),r=new FileReader();
    r.onload=e=>{
      img.onload=()=>{
        const sc=Math.min(1,maxW/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");cv.width=img.width*sc;cv.height=img.height*sc;
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",0.84).split(",")[1]);
      };img.onerror=rej;img.src=e.target.result;
    };r.onerror=rej;r.readAsDataURL(file);
  });
}
async function scanQrCamera(){
  if(!("BarcodeDetector" in window))return toast("Camera QR scan works on Chrome Android. Or upload QR photo / paste URL.");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const det=new BarcodeDetector({formats:["qr_code"]});
    $("#ocrOut").innerHTML=`<video id="qrVid" autoplay playsinline style="width:100%;border-radius:10px"></video><p class="mu">Point camera at Menu QR…</p>`;
    const v=$("#qrVid");v.srcObject=stream;
    const stop=()=>stream.getTracks().forEach(t=>t.stop());
    const tick=async()=>{
      if(!$("#qrVid"))return stop();
      const codes=await det.detect(v);
      if(codes.length){stop();$("#ocrTxt").value=codes[0].rawValue;parsePastedMenu();return;}
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){toast("Camera blocked: "+e.message);}
}
async function parsePastedMenu(){
  const txt=($("#ocrTxt").value||"").trim();if(!txt)return toast("Paste menu text or URL first");
  if(/^https?:\/\//i.test(txt)){
    $("#ocrOut").innerHTML=`<p>Menu URL detected: <a href="${esc(txt)}" target="_blank">${esc(txt)}</a>. Trying AI / fetch…</p>`;
    try{
      const resp=await fetch(txt);const html=await resp.text();
      const plain=html.replace(/<[^>]+>/g,"\n");
      const rows=smartParseMenuText(plain);
      if(rows.length){ocrRows=rows;return renderOcrPreview("Imported from Menu URL");}
    }catch(e){}
    return $("#ocrOut").innerHTML=`<p class="mu">Browser blocked direct site fetch (CORS). Open <a href="${esc(txt)}" target="_blank">your Menu link</a>, copy/screenshot the menu, and paste text or upload photo here!</p>`;
  }
  let rows=smartParseMenuText(txt);
  if(!rows.length&&sb){rows=await callAiOcr({rawText:txt})||[];}
  if(!rows.length)return toast("Could not find 'Dish Price' lines. Example: Masala Dosa 120");
  ocrRows=rows;renderOcrPreview("Parsed "+rows.length+" dishes");
}
function renderOcrPreview(title){
  $("#ocrOut").innerHTML=`<p style="color:var(--ok)"><b>${esc(title)} (${ocrRows.length})</b></p>
  <div class="tw" style="max-height:240px;overflow:auto"><table>
    <tr><th>Dish</th><th>Cat</th><th>₹</th><th></th></tr>
    ${ocrRows.map((x,i)=>`<tr>
      <td><input value="${esc(x.n)}" onchange="ocrRows[${i}].n=this.value"></td>
      <td><input value="${esc(x.c||"Mains")}" onchange="ocrRows[${i}].c=this.value"></td>

      <td><button class="sm wr" onclick="ocrRows.splice(${i},1);renderOcrPreview('Updated')">×</button></td>
    </tr>`).join("")}
  </table></div>
  <div class="tbs" style="margin-top:10px"><button class="pri" onclick="importOcr()">Add All to Menu</button></div>`;

function importOcr(){

function printZReport(){
  const td=new Date().toDateString(),allTd=S.bills.filter(b=>new Date(b.t).toDateString()===td);
  const B=allTd.filter(b=>!b.voided),voids=allTd.filter(b=>b.voided);
  const pay={};B.forEach(b=>{if(b.splits)Object.entries(b.splits).forEach(([k,v])=>pay[k]=(pay[k]||0)+v);else pay[b.pay]=(pay[b.pay]||0)+b.tot;});
  const tot=B.reduce((a,b)=>a+b.tot,0),tax=R(B.reduce((a,b)=>a+(b.tax||0),0)),disc=R(B.reduce((a,b)=>a+(b.disc||0),0));
  pt([
    (S.cfg.rName||"DINELOOP")+" - Z REPORT",
    new Date().toLocaleString("en-IN"),
    "-".repeat(32),
    L("Bills Count",B.length),
    L("Voided Bills",voids.length),
    L("Discounts","₹"+disc),
    L("Total GST","₹"+tax),
    L("NET SALES","₹"+tot),
    "-".repeat(32),
    L("Open Cash","₹"+(S.cfg.openCash||0)),
    ...Object.entries(pay).map(([k,v])=>L(k,"₹"+v)),
    L("Expected Cash","₹"+((+S.cfg.openCash||0)+(pay.Cash||0))),
    "-".repeat(32)
  ].join("\n"));
}
function voidBill(no){
  requireMgrPin(()=>{
    const b=S.bills.find(x=>x.no===no);if(!b||b.voided)return;
    const reason=prompt("Reason for void / refund:");if(!reason)return;
    b.voided=true;b.voidReason=reason.trim();b.voidAt=Date.now();
    // Restore stock
    b.items.forEach(bi=>{
      const m=S.menu.find(x=>bi.n.startsWith(x.n));if(!m||!m.s)return;
      const s=S.stock.find(x=>x.n===m.s);if(s)s.q=R(s.q+m.u*bi.q);
    });
    save();render();toast("Bill voided & stock restored");
  });
}
async function askAi(){
  const qText=($("#aiQ").value||"").trim();if(!qText)return toast("Enter a question");
  if(!sb)return toast("AI requires Cloud Mode");
  aiBusy=true;render();
  const td=new Date().toDateString(),B=S.bills.filter(b=>!b.voided&&new Date(b.t).toDateString()===td);
  const summary={
    billsToday:B.length,salesToday:B.reduce((a,b)=>a+b.tot,0),
    totalGuests:Object.keys(S.cust).length,menuCount:S.menu.length,
    lowStock:S.stock.filter(s=>s.q<=s.min).map(s=>s.n)
  };
  const r=await sb.functions.invoke("ai-assistant",{body:{mode:"ask",question:qText,summary}});
  aiBusy=false;
  aiAns=(r.data&&r.data.text)?r.data.text:(r.data&&r.data.error?r.data.error:"Set GEMINI_API_KEY in Supabase Edge Function ai-assistant.");
  render();
}
function dlCsv(kind){
  let rows=[];
  if(kind==="bills")rows=[["Invoice","Date","Table","Mode","Subtotal","Discount","GST","Total","Payment","Voided"],...S.bills.map(b=>[b.invNo||b.no,new Date(b.t).toISOString(),b.table,b.mode||"Dine-In",b.sub,b.disc,b.tax||0,b.tot,b.payLabel||b.pay,b.voided?"YES":"NO"])];
  if(kind==="menu")rows=[["ID","Name","Category","Price","GST%","StockLink","Usage","OutOfStock"],...S.menu.map(m=>[m.id,m.n,m.c,m.p,m.g??S.cfg.taxPct,m.s,m.u,m.oos?"YES":"NO"])];
  if(kind==="cust")rows=[["Mobile","Name","Points","Visits","Spent","WhatsAppOptIn"],...Object.entries(S.cust).map(([p,c])=>[p,c.name,c.pts,c.visits,c.spent,c.opt?"YES":"NO"])];
  if(kind==="stock")rows=[["Item","Qty","Unit","Min"],...S.stock.map(s=>[s.n,s.q,s.u,s.min])];
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`dineloop-${activeOutlet}-${kind}.csv`;a.click();
}

          <button class="sm ${r.active?"wr":"ok"}" onclick="toggleRest('${esc(r.id)}',${!r.active})">${r.active?"Pause":"Enable"}</button>
        </td>
      </tr>`).join("")}
      </table>
    </div>
  </div>
  <div class="card tw"><b>All Users Across Platform (${roleList.length})</b>
    <table style="margin-top:8px"><tr><th>Email</th><th>Name</th><th>Outlet</th><th>Role</th><th>Status</th></tr>
    ${roleList.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.display_name)}</td><td>${esc(u.restaurant_id)}</td><td><span class="tag">${esc(u.role)}</span></td><td>${u.active?"Active":"Disabled"}</td></tr>`).join("")}
    </table>
  </div>`;
}
async function onboardRest(){
  const id=$("#saId").value.trim().toLowerCase().replace(/[^a-z0-9-_]/g,"-");
  const name=$("#saNm").value.trim();if(!id||!name)return toast("Outlet ID and Name required");
  const city=$("#saCity").value.trim(),plan=$("#saPlan").value;
  const r=await sb.from("restaurants").upsert({id,name,city,plan,owner_email:$("#saEm").value.trim(),active:true});
  if(r.error)return toast(r.error.message);
  if($("#saEm").value.trim())await createCrewLogin(id,name,city,plan);
  await loadSaasLists();render();toast("Restaurant "+name+" ready!");
}
async function switchOutlet(id){await loadOutletState(id);restInfo=restList.find(x=>x.id===id)||null;tab="bill";render();toast("Switched to "+id);}
async function toggleRest(id,act){
  const r=await sb.from("restaurants").update({active:act}).eq("id",id);
  if(r.error)return toast(r.error.message);
  await loadSaasLists();render();toast(id+(act?" enabled":" paused"));
}

// ---------- KEYBOARD SHORTCUTS ----------
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeMdl();return;}
  if(tab==="bill"&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){
    if(e.key==="F2"){e.preventDefault();$("#srch")?.focus();}
    if(e.key==="F8"){e.preventDefault();kot();}
    if(e.key==="F4"){e.preventDefault();pay("Cash");}
  }
});

boot();
</script>
