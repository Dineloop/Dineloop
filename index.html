function masterMenu(){
  return MASTER_MENU_DATA.map((m,i)=>({id:i,n:m.n,p:m.p,c:m.c,s:"",u:0,g:null,v:[],a:[],oos:false,st:m.st,prep:m.prep,sku:"",hh:true,bom:[],diet:m.diet||"veg"}));

function mergeMasterMenuInto(state){
  if(!state||!Array.isArray(state.menu))return false;
  let changed=false;
  state.menu.forEach(m=>{
    if(m.n==="Masala Dosa"&&m.c==="Mains"){m.c="South Indian";changed=true;}
    if(m.n==="Masala Chai"&&m.c==="Drinks"){m.c="Beverages & Shakes";changed=true;}
  });
  const have=new Set(state.menu.map(m=>String(m.n||"").trim().toLowerCase()));
  let nextId=state.menu.reduce((mx,x)=>Math.max(mx,+x.id||0),-1)+1;
  masterMenu().forEach(m=>{
    if(!have.has(m.n.toLowerCase())){
      state.menu.push(Object.assign({},m,{id:nextId++}));
      changed=true;
    }
  });
  return changed;
}

  ["stock","bills","kots","kotsDone","holds","giftCards","campaigns","feedbacks","reservations","waitlist","suppliers","pos","wastage","expenses","shifts","riders","audit"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});

function subRealtime(){
  if(!sb||!user)return;
  if(rtCh){try{sb.removeChannel(rtCh)}catch(e){}}
  if(rtPo){try{sb.removeChannel(rtPo)}catch(e){}}
  rtCh=sb.channel("dl-"+activeOutlet)
    .on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"id=eq."+activeOutlet},p=>{
      const n=p.new&&p.new.data;
      if(n&&n._r!==S._r&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){
        const oldK=S.kots.length;S=normState(n);if(S.kots.length>oldK)playChime();render();
      }
    }).subscribe();
  rtPo=sb.channel("dl-po-"+activeOutlet)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"public_orders",filter:"restaurant_id=eq."+activeOutlet},p=>{
      playChime();toast("New Guest "+p.new.kind+" ("+(p.new.table_name||p.new.guest_name||"Online")+")");
      loadPubOrders().then(()=>render());
    }).subscribe();
}

// ---------- QR CODE HELPER (pure client-side SVG via qrcode-generator) ----------
function makeQrSvg(text,px=200){
  if(!text)return"";
  if(window.qrcode){
    const qr=qrcode(0,"M");qr.addData(text);qr.make();
    const n=qr.getModuleCount(),cell=Math.max(3,Math.floor(px/n)),sz=n*cell;
    let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))d+=`M${c*cell},${r*cell}h${cell}v${cell}h-${cell}z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return `<div style="padding:12px;color:#000;font-size:12px">QR text: ${esc(text)}</div>`;
}
function upiUri(amount,note){
  const id=(S.cfg.upiId||"").trim();if(!id)return"";
  const pn=encodeURIComponent(S.cfg.upiName||S.cfg.rName||"DineLoop");

  return `upi://pay?pa=${encodeURIComponent(id)}&pn=${pn}&am=${R(amount).toFixed(2)}&cu=INR&tn=${tn}`;
}

// ---------- CART & BILL MATH ----------
function isHappyHour(){
  const hh=S.cfg.happyHour;if(!hh||!hh.enabled||!hh.start||!hh.end)return false;
  const now=new Date(),cur=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  return cur>=hh.start&&cur<=hh.end;
}
function itemUnitPrice(l){
  if(l.openItem)return R(+l.p||0);
  const m=M(l.id);if(!m)return 0;
  let p=+m.p||0;
  if(l.v&&m.v){const vr=m.v.find(x=>x.n===l.v);if(vr)p=+vr.p||p;}
  if(Array.isArray(l.add)&&m.a){l.add.forEach(an=>{const ad=m.a.find(x=>x.n===an);if(ad)p+=(+ad.p||0);});}
  if(isHappyHour()&&m.hh!==false&&S.cfg.happyHour.pct>0)p=p*(1-(+S.cfg.happyHour.pct||0)/100);
  return R(p);
}
function itemLabel(l){
  if(l.openItem)return l.n||"Open Item";
  const m=M(l.id);if(!m)return"";
  let s=m.n;
  if(l.v)s+=` (${l.v})`;
  if(l.add&&l.add.length)s+=` +${l.add.join(",")}`;
  return s;
}
function calc(t=tb){
  const o=(S.open[t]||[]).filter(l=>l.openItem||M(l.id)),mt=meta(t),c=S.cust[ph];
  let sub=0,taxSum=0;
  o.forEach(l=>{
    const m=l.openItem?{g:null}:M(l.id),up=itemUnitPrice(l),line=up*l.q,rate=(m.g!==null&&m.g!==undefined)?+m.g:+S.cfg.taxPct;
    if(S.cfg.taxInc){
      const base=line/(1+rate/100);sub+=base;taxSum+=(line-base);
    }else{
      sub+=line;taxSum+=line*(rate/100);
    }
  });
  sub=R(sub);
  let loyDisc=rd&&c&&c.pts>=(S.cfg.redeemPts||100)?Math.min(S.cfg.redeemVal||50,sub):0;
  let manDisc=0;
  if(mt.discType==="pct")manDisc=R(sub*(Math.min(100,+mt.discVal||0)/100));
  else if(mt.discType==="flat")manDisc=Math.min(sub,+mt.discVal||0);
  const disc=R(Math.min(sub,loyDisc+manDisc));
  const discRatio=sub>0?Math.max(0,(sub-disc)/sub):1;
  const tax=R(taxSum*discRatio),cgst=R(tax/2),sgst=R(tax-cgst);
  const svc=R((sub-disc)*(+S.cfg.svcPct||0)/100);
  const pkg=mt.mode==="Parcel"&&o.length?(+S.cfg.pkgFee||0):0;
  const del=mt.mode==="Delivery"&&o.length?(+S.cfg.delFee||0):0;
  const raw=sub-disc+tax+svc+pkg+del,tot=Math.round(raw);
  const paidAmt=R(mt.prepaid?(+mt.prepaidAmt||0):0);
  const due=Math.max(0,R(tot-paidAmt));
  return{o,mt,sub,loyDisc,manDisc,disc,tax,cgst,sgst,svc,pkg,del,ro:R(tot-raw),tot,paidAmt,due,c};
}

function separateJoinedTables(t=tb,showToast=true){

  if(a+b+c!==tot)return toast("Split amounts must equal ₹"+tot);

// ---------- KOT & PAYMENT ----------
function nextToken(){
  const td=new Date().toDateString();if(S.tokenDay!==td){S.tokenDay=td;S.tokenNo=0;}
  return ++S.tokenNo;
}
function kot(quiet=false,t=tb){
  const o=S.open[t]||[],mt=meta(t);
  const it=o.filter(l=>l.q>l.sent).map(l=>{
    const m=l.openItem?{st:"Main Kitchen",prep:10}:M(l.id);
    return{n:itemLabel(l),q:l.q-l.sent,note:l.note||"",st:(m&&m.st)||"Main Kitchen",prep:(m&&m.prep)||12};
  });
  if(!it.length){if(!quiet)toast("Nothing new to send");return false}
  const tok=(t==="Counter"||t==="Takeaway")?nextToken():0;
  const maxPrep=Math.max(...it.map(x=>x.prep||12));
  const k={id:++S.kn,tok,table:t,mode:mt.mode,prepaid:!!mt.prepaid,by:activeName,items:it,st:0,t:Date.now(),prep:maxPrep};
  S.kots.push(k);o.forEach(l=>l.sent=l.q);
  playChime();
  save();if(tab==="bill")cart();else render();
  if(!quiet)toast("KOT #"+k.id+(tok?" (Token #"+tok+")":"")+" sent to kitchen");
  if(ap){
    pt(["KOT #"+k.id+(tok?"  TOKEN #"+tok:"")+"  "+t+" ["+mt.mode+(mt.prepaid?" PAID":"")+"]",new Date(k.t).toLocaleTimeString("en-IN"),"-".repeat(32),...it.map(x=>x.q+" x "+x.n+(x.note?" ("+x.note+")":""))].join("\n"));
  }
  return true;
}

function openPrepaidMdl(){

  showMdl(`<b>Collect Prepaid & Keep Table Open · ${esc(tb)}</b>

    <div class="tbs" style="margin-top:12px">
      <button class="pri" onclick="collectPrepaid('Cash')">Cash Prepaid (₹${c.due})</button>
      <button class="pri" onclick="collectPrepaid('UPI')">UPI Prepaid (₹${c.due})</button>
      <button class="pri" onclick="collectPrepaid('Card')">Card Prepaid (₹${c.due})</button>
      <button onclick="closeMdl()">Cancel</button>
    </div>`);
}
function collectPrepaid(m){
  closeMdl();
  const c=calc(tb);if(!c.o.length||c.due<=0)return;
  const code=String(Math.floor(1000+Math.random()*9000));
  const mt=meta(tb);
  mt.prepaid=true;mt.prepaidAmt=R(c.paidAmt+c.due);mt.prepaidCode=code;mt.prepaidAt=Date.now();mt.prepaidBy=activeName;mt.prepaidVerified=false;
  kot(true,tb);
  recordBill(m,tb,null,c.due,true,code);
  toast(`Prepaid ₹${c.due} · Verify Code: ${code}`);
}
function clearTable(t=tb){
  const old=meta(t),kids=Array.isArray(old.joined)?[...old.joined]:[];
  kids.forEach(kt=>{
    if(kt!==t){
      S.open[kt]=[];
      S.openMeta[kt]={mode:kt==="Takeaway"?"Parcel":"Dine-In",occ:false,pax:0,waiterName:"",updatedAt:0,prepaid:false,prepaidAmt:0,prepaidCode:"",prepaidAt:0,prepaidVerified:false,prepaidBy:"",discType:"",discVal:0,coupon:"",note:"",joined:[],linkedTo:"",groupName:""};
    }
  });
  S.open[t]=[];S.openMeta[t]={mode:t==="Takeaway"?"Parcel":"Dine-In",occ:false,pax:0,waiterName:"",updatedAt:0,prepaid:false,prepaidAmt:0,prepaidCode:"",prepaidAt:0,prepaidVerified:false,prepaidBy:"",discType:"",discVal:0,coupon:"",note:"",joined:[],linkedTo:"",groupName:""};
  rd=false;ph="";nmv="";op=false;save();render();toast((kids.length>1?kids.join("+"):t)+" cleared for next guest");
}
function recordBill(m,t,splits,chargeAmt,isPrepaid,preCode=""){
  const c=calc(t),P=ph,ok=P.length===10;let u=null,waTxt="";
  const invNo=(S.cfg.invPrefix||"DL-")+String(S.cfg.invNext||1).padStart(4,"0");
  S.cfg.invNext=(S.cfg.invNext||1)+1;
  const billItems=c.o.map(l=>({n:itemLabel(l),q:l.q,p:itemUnitPrice(l)}));
  if(ok){
    u=S.cust[P]=S.cust[P]||{name:"",pts:0,visits:0,last:0,spent:0,opt:0,wallet:0};
    u.name=nmv||u.name||"Guest";
    const mult=(window.getTier?window.getTier(u).mult:1);
    const earned=Math.floor((chargeAmt/10)*(S.cfg.ptsPer10||1)*mult);
    u.pts+=earned-(c.loyDisc?(S.cfg.redeemPts||100):0);
    u.visits++;u.last=Date.now();u.spent+=chargeAmt;
    u.lastOrder=c.o.filter(l=>!l.openItem).map(l=>({n:M(l.id).n,q:l.q}));
    if(op)u.opt=1;
    const fbLink=`${location.origin}/order.html?outlet=${encodeURIComponent(activeOutlet)}&fb=${encodeURIComponent(invNo)}&ph=${P}`;
    waTxt=`Thanks for visiting ${S.cfg.rName}! Bill ${invNo} ₹${chargeAmt} paid by ${m}.${preCode?" Prepaid Verify Code: "+preCode+".":""} Earned ${earned} pts (Bal: ${u.pts}). Feedback: ${fbLink}`;
  }
  if(!isPrepaid||c.paidAmt===0){
    c.o.forEach(l=>{
      if(l.openItem)return;
      const it=M(l.id);if(!it)return;
      if(it.bom&&it.bom.length){it.bom.forEach(b=>{const s=S.stock.find(x=>x.n===b.n);if(s)s.q=R(Math.max(0,s.q-b.q*l.q));});}
      else if(it.s){const s=S.stock.find(x=>x.n===it.s);if(s)s.q=R(Math.max(0,s.q-it.u*l.q));}
    });
  }
  const payLabel=splits?Object.entries(splits).map(([k,v])=>`${k} ₹${v}`).join(" + "):m;
  lastB={
    no:S.bills.length+1,invNo,t:Date.now(),table:t,mode:c.mt.mode,prepaid:!!isPrepaid,prepaidCode:preCode,
    items:billItems,sub:c.sub,disc:c.disc,tax:c.tax,cgst:c.cgst,sgst:c.sgst,svc:c.svc,pkg:c.pkg,del:c.del,ro:c.ro,
    tot:chargeAmt,pay:m,payLabel,splits,ph:ok?P:"",cashier:activeName
  };
  S.bills.push(lastB);
  if(S.cfg.webhookUrl){try{fetch(S.cfg.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event:"bill.paid",outlet:activeOutlet,bill:lastB})}).catch(()=>{});}catch(e){}}
  if(window.logAudit)window.logAudit("bill.paid",{invNo,tot:chargeAmt,pay:payLabel});
  const waBtn=ok?`<button onclick="sendBillWA('${P}',lastB)">WhatsApp E-Bill</button>`:"";
  link=`<div class="tbs" style="margin-top:6px"><button class="ok" onclick="prn()">Print ${isPrepaid?"Prepaid Slip":"Bill"} (${invNo})</button>${waBtn}</div>`;
  save();render();
  if(ok&&u&&u.opt)sendWA(P,waTxt);
}
function pay(m,t=tb,splits=null){
  const c=calc(t);if(!c.o.length)return toast("Add items first");
  if(c.due<=0){clearTable(t);return;}
  kot(true,t);
  recordBill(m,t,splits,c.due,false,"");
  S.open[t]=[];S.openMeta[t]={mode:t==="Takeaway"?"Parcel":"Dine-In",occ:false,pax:0,waiterName:"",updatedAt:0,prepaid:false,prepaidAmt:0,prepaidCode:"",prepaidAt:0,prepaidVerified:false,prepaidBy:"",discType:"",discVal:0,coupon:"",note:""};
  rd=false;ph="";nmv="";op=false;
  save();toast("Paid ₹"+c.due);render();
}

// ---------- RECEIPT PRINTING + WHATSAPP E-BILL ----------
const L=(a,b)=>String(a).padEnd(23)+String(b).padStart(9);
function bt(b){
  const lines=[
    (S.cfg.rName||"DINELOOP").toUpperCase(),
    ...(S.cfg.addr?[S.cfg.addr]:[]),
    ...(S.cfg.phone?["Ph: "+S.cfg.phone]:[]),
    ...(S.cfg.gstin?["GSTIN: "+S.cfg.gstin]:[]),
    "Bill "+(b.invNo||"#"+b.no)+"  "+new Date(b.t).toLocaleString("en-IN"),
    "Table: "+b.table+" ["+(b.mode||"Dine-In")+"]",
    "-".repeat(32),
    ...b.items.map(i=>L(i.n.slice(0,17)+" x"+i.q,"₹"+R(i.p*i.q))),
    "-".repeat(32),
    L("Subtotal","₹"+R(b.sub)),
    ...(b.disc?[L("Discount","-₹"+R(b.disc))]:[]),
    ...(b.tax?[L("CGST","₹"+R(b.cgst||b.tax/2)),L("SGST","₹"+R(b.sgst||b.tax/2))]:[]),
    ...(b.svc?[L("Service Chg","₹"+R(b.svc))]:[]),
    ...(b.pkg?[L("Packaging","₹"+R(b.pkg))]:[]),
    ...(b.del?[L("Delivery","₹"+R(b.del))]:[]),
    ...(b.ro?[L("Round off",b.ro)]:[]),
    L("TOTAL","₹"+b.tot),
    "Paid: "+(b.payLabel||b.pay)+(b.voided?" [VOIDED]":""),
    ...(b.prepaidCode?["*** PREPAID VERIFY CODE: "+b.prepaidCode+" ***","Show this code to your waiter"]:[]),
    "",
    "Thank you! Visit again"
  ];
  return lines.join("\n");
}
function pt(text,qrSvg=""){
  $("#rcp").innerHTML=esc(text)+(qrSvg?`<div class="rqr">${qrSvg}<div>Scan to Pay ₹${lastB?lastB.tot:""}</div></div>`:"");
  window.print();
}
function prn(b=lastB){
  if(!b)return;
  const uri=upiUri(b.tot,b.invNo||"Bill");
  pt(bt(b),uri?makeQrSvg(uri,130):"");
}
function sendBillWA(phone,b){
  if(!b)return;
  const txt=`*${S.cfg.rName||"DineLoop"}* E-Bill ${b.invNo||"#"+b.no}%0A`+
    b.items.map(i=>`${i.q}x ${i.n} = ₹${R(i.p*i.q)}`).join(", ")+
    ` | Total: ₹${b.tot} (${b.payLabel||b.pay}). Thank you!`;
  sendWA(phone,decodeURIComponent(txt));
}
async function sendWA(to,t){
  if(!to||to.length!==10)return toast("Need 10-digit mobile");
  if(sb){
    const r=await sb.functions.invoke("send-wa",{body:{to:"91"+to,text:t.replace(/\s+/g," ")}});
    if(r.error){window.open("https://wa.me/91"+to+"?text="+encodeURIComponent(t),"_blank");toast("Opened WhatsApp link");}
    else toast("Sent on WhatsApp");
  }else{
    window.open("https://wa.me/91"+to+"?text="+encodeURIComponent(t),"_blank");
  }
}

      const mins=Math.max(0,Math.round((Date.now()-k.t)/6e4)),late=mins>(k.prep||15);
      return `<div class="k" style="${late?"border-left-color:var(--wr)":""}" onclick="adv(${k.id})">
        <div class="row" style="border:0;padding:0"><b>KOT #${k.id}${k.tok?" · Tkn #"+k.tok:""} · ${esc(k.table)}</b><span class="tag ${k.prepaid?"okt":""}">${esc(k.mode||"Dine-In")}${k.prepaid?" · PAID":""}</span></div>
        <div class="mu" style="${late?"color:var(--wr);font-weight:700":""}">${mins}m / ${k.prep||12}m ${late?"⚠ OVERDUE":""} ${k.by?"· "+esc(k.by):""}</div>
        ${k.items.filter(x=>kdsStation==="All"||(x.st||"Main Kitchen")===kdsStation).map(x=>`<div><b>${x.q}×</b> ${esc(x.n)} <small class="tag">${esc(x.st||"Kitchen")}</small>${x.note?` <small class="mu">(${esc(x.note)})</small>`:""}</div>`).join("")}

  return `<div class="card" style="padding:10px 14px"><div class="tbs" style="margin:0">
    ${stations.map(s=>`<button class="sm ${!kdsExpo&&kdsStation===s?"on":""}" onclick="kdsExpo=false;kdsStation='${s}';render()">${s}</button>`).join("")}

  </div></div>${body}
  ${rec.length?`<div class="card"><b>Recall Recently Cleared Tickets</b><div class="tbs" style="margin-top:8px">${rec.map((k,ri)=>`<button class="sm" onclick="recallKot(${S.kotsDone.length-1-ri})">↺ KOT #${k.id} (${esc(k.table)})</button>`).join("")}</div></div>`:""}`;
}
function adv(id){
  const k=S.kots.find(x=>x.id==id);if(!k)return;k.st++;
  if(k.st>2){S.kots.splice(S.kots.indexOf(k),1);S.kotsDone=S.kotsDone||[];S.kotsDone.push(k);if(S.kotsDone.length>20)S.kotsDone=S.kotsDone.slice(-20);}
  save();render();
}
function recallKot(idx){
  const k=(S.kotsDone||[]).splice(idx,1)[0];if(!k)return;k.st=2;S.kots.push(k);save();render();toast("Recalled KOT #"+k.id);
}

  return (str||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{
    const [n,p]=x.split(":");return{n:(n||"").trim(),p:+p||0};
  }).filter(x=>x.n);
}

  const prev=id!==null?M(id):null;
  const obj={
    id:id!==null?id:S.menu.reduce((mx,x)=>Math.max(mx,x.id),0)+1,
    n,p,c,diet:$("#mdiet").value||"veg",st:$("#mst").value,prep:+$("#mprep").value||12,sku:$("#msku").value.trim(),hh:$("#mhh").checked,
    s:$("#ms").value.trim(),u:+$("#mu").value||0,bom:(prev&&prev.bom)||[],
    g:gRaw===""?null:+gRaw,v:parsePairs($("#mv").value),a:parsePairs($("#ma").value),oos:prev?!!prev.oos:false
  };
  if(id!==null){const idx=S.menu.findIndex(x=>x.id===id);S.menu[idx]=obj;}
  else S.menu.push(obj);
  save();closeMdl();render();toast("Dish saved");
}

function smartParseMenuText(raw){
  const lines=String(raw||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let curCat="Mains";const out=[];
  for(const line of lines){
    // Detect category header (no digits, short)
    if(!/\d/.test(line)&&line.length>=3&&line.length<=28&&!/^(menu|gst|phone|tel|address)/i.test(line)){
      curCat=line.replace(/[:\-*#]+/g,"").trim();continue;
    }
    const m=line.match(/^(.+?)\s*(?:[-–:|.]+\s*|\s+)(?:rs\.?|inr|₹)?\s*(\d{2,4})(?:\.\d{1,2})?\s*$/i);
    if(m){
      const name=m[1].replace(/[.\-–:]+$/,"").trim();
      const price=+m[2];
      if(name.length>=2&&price>0&&price<20000)out.push({n:name,p:price,c:curCat,g:S.cfg.taxPct});
    }
  }
  return out;
}

async function handleOcrFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  $("#ocrOut").innerHTML=`<p>Reading <b>${esc(f.name)}</b>…</p>`;
  if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
    try{
      const pdfText=await extractPdfText(f);
      if(pdfText&&pdfText.trim().length>20){
        const localRows=smartParseMenuText(pdfText);
        if(sb){
          const aiRows=await callAiOcr({rawText:pdfText});
          if(aiRows&&aiRows.length){ocrRows=aiRows;return renderOcrPreview("Extracted from PDF via AI");}
        }
        if(localRows.length){ocrRows=localRows;return renderOcrPreview("Extracted from PDF text");}
      }
      // Scanned PDF fallback -> send base64 to Gemini
      const b64=await fileToB64(f);
      const aiRows=await callAiOcr({fileBase64:b64,mimeType:"application/pdf"});
      if(aiRows&&aiRows.length){ocrRows=aiRows;return renderOcrPreview("Extracted from Scanned PDF via AI");}
      $("#ocrOut").innerHTML=`<p class="mu" style="color:var(--wr)">Could not auto-extract scanned PDF. Set GEMINI_API_KEY in Supabase (doc 06) or paste the text above.</p>`;
    }catch(e){$("#ocrOut").innerHTML=`<p style="color:var(--wr)">PDF read error: ${esc(e.message)}</p>`;}
  }else{
    // Image -> compress & call Gemini Vision OCR
    try{
      const b64=await compressImgB64(f,1400);
      const aiRows=await callAiOcr({fileBase64:b64,mimeType:"image/jpeg"});
      if(aiRows&&aiRows.length){ocrRows=aiRows;return renderOcrPreview("Extracted from Photo via AI");}
      $("#ocrOut").innerHTML=`<p class="mu" style="color:var(--wr)">Photo OCR needs Gemini AI key in Supabase Edge Function (ai-assistant). You can also paste menu lines like "Paneer Tikka - 240" above!</p>`;
    }catch(e){$("#ocrOut").innerHTML=`<p style="color:var(--wr)">Image read error: ${esc(e.message)}</p>`;}
  }
}

async function callAiOcr(payload){
  if(!sb)return null;
  const r=await sb.functions.invoke("ai-assistant",{body:{mode:"ocr",...payload}});
  if(r.error||!r.data||r.data.fallback||!r.data.text)return null;
  try{
    const clean=r.data.text.replace(/```json|```/g,"").trim();
    const arr=JSON.parse(clean);
    return Array.isArray(arr)?arr.filter(x=>x&&x.n&&(+x.p>0)):null;
  }catch(e){return null;}
}

async function extractPdfText(file){
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
      s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  }
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let all="";
  for(let p=1;p<=Math.min(pdf.numPages,10);p++){
    const pg=await pdf.getPage(p),tc=await pg.getTextContent();
    all+=tc.items.map(i=>i.str).join(" ")+"\n";
  }
  return all;
}

function fileToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);
  });
}
function compressImgB64(file,maxW){
  return new Promise((res,rej)=>{
    const img=new Image(),r=new FileReader();
    r.onload=e=>{
      img.onload=()=>{
        const sc=Math.min(1,maxW/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");cv.width=img.width*sc;cv.height=img.height*sc;
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",0.84).split(",")[1]);
      };img.onerror=rej;img.src=e.target.result;
    };r.onerror=rej;r.readAsDataURL(file);
  });
}
async function scanQrCamera(){
  if(!("BarcodeDetector" in window))return toast("Camera QR scan works on Chrome Android. Or upload QR photo / paste URL.");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const det=new BarcodeDetector({formats:["qr_code"]});
    $("#ocrOut").innerHTML=`<video id="qrVid" autoplay playsinline style="width:100%;border-radius:10px"></video><p class="mu">Point camera at Menu QR…</p>`;
    const v=$("#qrVid");v.srcObject=stream;
    const stop=()=>stream.getTracks().forEach(t=>t.stop());
    const tick=async()=>{
      if(!$("#qrVid"))return stop();
      const codes=await det.detect(v);
      if(codes.length){stop();$("#ocrTxt").value=codes[0].rawValue;parsePastedMenu();return;}
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){toast("Camera blocked: "+e.message);}
}
async function parsePastedMenu(){
  const txt=($("#ocrTxt").value||"").trim();if(!txt)return toast("Paste menu text or URL first");

// ---------- AUTOMATED QA BOT, SCREENSHOT CATCHER & BUG MONITOR ----------
let _lastErrAt=0,_lastErrMsg="";
function makeStatusSnapshotCanvas(note){
  const cv=document.createElement("canvas");cv.width=720;cv.height=360;
  const cx=cv.getContext("2d");
  cx.fillStyle="#111318";cx.fillRect(0,0,720,360);
  cx.fillStyle="#e2b75c";cx.font="bold 22px system-ui";cx.fillText("DineLoop Auto Snapshot",24,42);
  cx.fillStyle="#9ca3af";cx.font="14px monospace";
  cx.fillText("Time: "+new Date().toLocaleString("en-IN"),24,72);
  cx.fillText("Outlet: "+activeOutlet+" | Tab: "+tab+" | Role: "+myRole,24,96);
  cx.fillText("URL: "+location.href.slice(0,75),24,120);
  cx.fillStyle="#fca5a5";cx.font="15px monospace";
  String(note||"").slice(0,260).match(/.{1,62}/g)?.forEach((ln,i)=>cx.fillText(ln,24,165+i*24));
  return cv.toDataURL("image/jpeg",0.72);
}
async function captureBugShot(note=""){
  try{
    if(!window.html2canvas){
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
        s.onload=res;s.onerror=rej;setTimeout(rej,2500);
        document.head.appendChild(s);
      });
    }
    if(window.html2canvas){
      const canvas=await window.html2canvas(document.body,{scale:0.65,useCORS:true,logging:false,backgroundColor:"#111318"});
      return canvas.toDataURL("image/jpeg",0.65);
    }
  }catch(e){}
  try{return makeStatusSnapshotCanvas(note);}catch(e){return "";}
}
async function submitBugReport(payload){
  if(!sb||!user)return null;
  const r=await sb.functions.invoke("bug-alert",{body:Object.assign({restaurant_id:activeOutlet,page_url:location.href},payload)});
  if(r.error||!r.data?.ok){
    const ins=await sb.from("bug_reports").insert({
      restaurant_id:activeOutlet,reporter_email:user.email||"",reporter_role:trueRole,
      source:payload.source||"auto",severity:payload.severity||"error",
      title:String(payload.title||"Error").slice(0,240),details:String(payload.details||""),
      page_url:location.href,screenshot_data:payload.screenshot_data||"",status:"open"
    }).select("id").single();
    return {ok:!ins.error,bug_id:ins.data?.id,emailed:false,email_hint:"Saved directly to DB (deploy bug-alert function for AI + email)."};
  }
  return r.data;
}
window.addEventListener("error",e=>{
  if(!sb||!user)return;
  const msg=(e.message||"Script Error").slice(0,200);
  if(msg===_lastErrMsg&&Date.now()-_lastErrAt<30000)return;
  _lastErrAt=Date.now();_lastErrMsg=msg;
  captureBugShot(msg).then(shot=>submitBugReport({
    source:"auto",severity:"error",title:msg,
    details:`${e.filename||""}:${e.lineno||0}:${e.colno||0}\n${e.error?.stack||""}`,screenshot_data:shot
  }));
});
window.addEventListener("unhandledrejection",e=>{
  if(!sb||!user)return;
  const msg=String(e.reason?.message||e.reason||"Promise Rejection").slice(0,200);
  if(msg===_lastErrMsg&&Date.now()-_lastErrAt<30000)return;
  _lastErrAt=Date.now();_lastErrMsg=msg;
  captureBugShot(msg).then(shot=>submitBugReport({
    source:"auto",severity:"error",title:msg,
    details:String(e.reason?.stack||e.reason||""),screenshot_data:shot
  }));
});

async function runQaBot(sendTestAlert=false){
  qaBusy=true;qaReport=[];render();
  const checks=[];
  for(const path of ["/","/waiter.html","/order.html","/display.html","/landing.js","/crm.js","/erp.js","/platform.js"]){
    try{
      const r=await fetch(path,{method:"HEAD",cache:"no-store"});
      checks.push({name:"Asset "+path,ok:r.ok,info:"HTTP "+r.status});
    }catch(e){checks.push({name:"Asset "+path,ok:false,info:String(e)});}
  }
  try{
    const r=await sb.from("restaurants").select("id,active").limit(50);
    checks.push({name:"Supabase DB (restaurants)",ok:!r.error,info:r.error?r.error.message:(r.data?.length||0)+" outlets OK"});
  }catch(e){checks.push({name:"Supabase DB",ok:false,info:String(e)});}
  try{
    const prev=tb,bak=S.open[prev];
    const tmp=[{id:-999,openItem:true,n:"QA Item",p:100,q:2,g:5}];S.open.__qa=tmp;
    const c=calc("__qa");delete S.open.__qa;
    const ok=c.sub>0&&c.tot>=200;
    checks.push({name:"Billing & GST Formula",ok,info:`Sub ₹${c.sub}, Tax ₹${c.tax}, Tot ₹${c.tot}`});
  }catch(e){checks.push({name:"Billing & GST Formula",ok:false,info:String(e)});}
  qaReport=checks;
  const fails=checks.filter(x=>!x.ok);
  if(fails.length||sendTestAlert){
    const shot=await captureBugShot(fails.length?fails.map(f=>f.name+": "+f.info).join("; "):"QA Bot Test Alert");
    const res=await submitBugReport({
      source:"qa_bot",
      severity:fails.length?"error":"info",
      title:fails.length?`QA Bot found ${fails.length} issue(s)`:`QA Bot Health Check (${checks.length}/${checks.length} Passed)`,
      details:checks.map(x=>`${x.ok?"PASS":"FAIL"} | ${x.name} | ${x.info}`).join("\n"),
      screenshot_data:shot,
      send_email:true
    });
    if(res?.email_hint)toast(res.email_hint);
    else toast(res?.emailed?"Bug alert emailed with screenshot!":"Logged #"+res?.bug_id);
  }else{
    toast(`All ${checks.length} QA checks passed!`);
  }
  qaBusy=false;await loadSaasLists();render();
}
